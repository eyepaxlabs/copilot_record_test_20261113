<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Web Page</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; }
header { background: #2457a7; color: white; padding: 24px; text-align: center; }
main { max-width: 700px; margin: 40px auto; padding: 24px; background: white; border-radius: 12px; }
button { background: #2457a7; color: white; border: 0; padding: 12px 20px; border-radius: 6px; cursor: pointer; }
footer { text-align: center; color: #666; padding: 20px; }
</style>
</head>
<body>
<header>
<h1>Welcome to Eyepax AIT Website</h1>
<p>A simple HTML page with 30 lines of code.</p>
</header>
<main>
<h2>About This Page</h2>
<p>This example includes HTML, CSS, and JavaScript.</p>
<button onclick="showMessage()">Click Me</button>
<p id="message"></p>
<h2>Contact Form</h2>
<form onsubmit="validateForm(event)" novalidate>
<label for="visitorName">Name</label>
<input id="visitorName" name="name" type="text">
<label for="visitorEmail">Email</label>
<input id="visitorEmail" name="email" type="email">
<button type="submit">Validate</button>
</form>
<p id="formMessage" aria-live="polite"></p>
</main>
<footer>Made with HTML</footer>
<script>
function showMessage() { document.getElementById('message').textContent = 'Hello! Thanks for clicking.'; }
function validateForm(event) {
event.preventDefault();
const nameInput = document.getElementById('visitorName');
const emailInput = document.getElementById('visitorEmail');
const message = document.getElementById('formMessage');
const name = nameInput.value.trim();
const email = emailInput.value.trim();
message.textContent = '';
if (!name) {
message.textContent = 'Please enter your name.';
nameInput.focus();
return;
}
if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
message.textContent = 'Please enter a valid email address.';
emailInput.focus();
return;
}
message.textContent = `Thanks, ${name}. Your details are valid.`;
}
</script>
</body></html>
